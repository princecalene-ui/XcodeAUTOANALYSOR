services:
  - type: web
    name: xcode-suit-card
    runtime: python
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    startCommand: python simple_app.py
    healthCheckPath: /health
    numInstances: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DATA_DIR
        value: /var/data
    disk:
      name: xcode-suit-card-data
      mountPath: /var/data
      sizeGB: 1
